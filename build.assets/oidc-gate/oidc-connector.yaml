kind: oidc
version: v3
metadata:
  name: oidc-gate-probe
spec:
  issuer_url: https://dummy-idp.invalid/realms/test
  client_id: teleport-gate
  client_secret: gate-secret
  redirect_url: https://localhost:3080/v1/webapi/oidc/callback
  claims_to_roles:
    - claim: groups
      value: admins
      roles:
        - access
