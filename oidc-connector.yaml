kind: oidc
version: v3
metadata:
  name: keycloak
spec:
  # Issuer URL from your Keycloak instance
  issuer_url: "https://iam.global.fredhopperservices.com/realms/master"

  # Client ID and Secret
  client_id: teleport
  client_secret: replace-me

  # Redirect URL - where Keycloak will send users after authentication
  redirect_url: "https://localhost:3080/v1/webapi/oidc/callback"

  # Display name in Teleport UI
  display: "Keycloak SSO"

  # Scopes to request from Keycloak
  scope:
    - openid
    - email
    - profile
    - groups

  # Map claims from Keycloak to Teleport roles
  claims_to_roles:
    # Map users based on email domain
    - claim: "email"
      value: "*@fredhopperservices.com"
      roles:
        - access
        - editor

    # Map all authenticated users to basic access role
    - claim: "email"
      value: "*"
      roles:
        - access

  # Optional: Map Keycloak groups to Teleport roles
  # Uncomment and adjust based on your Keycloak groups
  # - claim: "groups"
  #   value: "teleport-admins"
  #   roles:
  #     - editor
  #     - access

  # Optional: Username claim (defaults to "email")
  username_claim: "preferred_username"

